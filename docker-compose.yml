services:
  cdg-ia-sync-test:
    build: .
    container_name: cdg-ia-sync-test
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MVSEP_TOKEN_FILE: /runtime/mvsep_token
      QWEN_RUNTIME_DIR: /runtime
    volumes:
      - ./runtime:/runtime
    ports:
      - "127.0.0.1:8097:8000"
