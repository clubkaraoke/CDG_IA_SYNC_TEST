services:
  qwen-worker:
    build:
      context: ..
      dockerfile: gpu_worker/Dockerfile
    restart: unless-stopped
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN}
      QWEN_ASR_MODEL: Qwen/Qwen3-ASR-1.7B
      QWEN_ALIGNER_MODEL: Qwen/Qwen3-ForcedAligner-0.6B
      QWEN_DEVICE: cuda:0
      QWEN_MAX_NEW_TOKENS: 2048
    volumes:
      - qwen-models:/models
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qwen-models:
