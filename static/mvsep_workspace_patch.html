<style id="djgabo-mvsep-workspace-style">
#djgaboWorkspace,#djgaboDynamicMixer{display:none!important}
header.top{position:relative}
.dj-proj-menu-btn{margin-left:10px!important;min-width:40px!important;height:36px!important;border:1px solid #394457!important;background:#171d27!important;color:#eef2f7!important;border-radius:9px!important;font-size:19px!important;line-height:1!important;cursor:pointer!important;pointer-events:auto!important}
.dj-proj-menu-btn:hover{background:#222a37!important}
#djProjectsOverlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:999970;display:none}
#djProjectsOverlay.open{display:block}
#djProjectsDrawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,94vw);z-index:999980;background:#0d1118;border-left:1px solid #2d3542;box-shadow:-18px 0 50px rgba(0,0,0,.42);transform:translateX(105%);transition:transform .18s ease;color:#eef2f7;font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;pointer-events:auto}
#djProjectsDrawer.open{transform:translateX(0)}
#djProjectsDrawer *{box-sizing:border-box}
#djProjectsDrawer .head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #272f3c;background:#10151d}
#djProjectsDrawer .title{font-size:15px;font-weight:900}
#djProjectsDrawer .sub{font-size:11px;color:#929fb1;margin-top:2px}
#djProjectsDrawer button{border:1px solid #394457;background:#171d27;color:#edf2f8;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}
#djProjectsDrawer .close{font-size:18px;width:36px;height:34px;padding:0}
#djProjectsDrawer .tools{padding:10px 12px;border-bottom:1px solid #252c37}
#djProjectsDrawer .tools button{width:100%}
#djProjectsList{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dj-project{border:1px solid #293240;background:#111720;border-radius:10px;padding:11px;display:grid;gap:7px}
.dj-project-name{font-weight:850;line-height:1.25;word-break:break-word}
.dj-project-meta{display:flex;flex-wrap:wrap;gap:6px;color:#94a1b3;font-size:11px}
.dj-pill{border:1px solid #354153;border-radius:999px;padding:2px 7px}
.dj-pill.ok{color:#54dca8;border-color:#245f4b}
.dj-project-actions{display:flex;justify-content:flex-end}
.dj-open{background:#6555e8!important;border-color:#7668f3!important;color:#fff!important}
.dj-loading,.dj-error{padding:14px;color:#9ba8ba}.dj-error{color:#ff8998}

#djNativeStemGrid{display:none}
body.dj-project-active #editor-de-stems{display:block!important}
body.dj-project-active #editor-de-stems .rails,
body.dj-project-active #editor-de-stems .stems-container,
body.dj-project-active #editor-de-stems .wave-scroller{display:none!important}
body.dj-project-active #djNativeStemGrid{display:block!important}
.dj-native-project-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #29313e;background:#10151d}
.dj-native-project-title{min-width:0;font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-native-project-status{font-size:11px;color:#9aa7b9;white-space:nowrap}.dj-native-project-status.ok{color:#55dca8}.dj-native-project-status.err{color:#ff8193}
.dj-native-row{display:grid;grid-template-columns:116px minmax(0,1fr);min-height:136px;border-bottom:1px solid #202833;background:#0c1118}
.dj-native-side{padding:9px 8px;border-right:1px solid #2d3644;background:#111720;display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.dj-native-name{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-native-role{font-size:10px;color:#98a5b7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-native-buttons{display:flex;gap:5px;flex-wrap:wrap}.dj-native-buttons button{border:1px solid #394457;background:#171d27;color:#edf2f8;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:800;cursor:pointer}.dj-native-buttons button.on{background:#6555e8;border-color:#7668f3}.dj-native-buttons button.silence{background:#4f427e;border-color:#6c5bc1}.dj-native-buttons button:disabled{opacity:.38;cursor:not-allowed}
.dj-native-vol{display:grid;grid-template-columns:auto 1fr 28px;gap:4px;align-items:center;font-size:9px;color:#8f9bad}.dj-native-vol input{width:100%;accent-color:#7b67ff}.dj-native-info{font-size:9px;color:#8f9bad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-native-wave{position:relative;min-width:0;background:#080c12}.dj-native-wave canvas{display:block;width:100%;height:136px;touch-action:none;cursor:crosshair}.dj-wave-badge{position:absolute;right:8px;top:7px;z-index:2;background:rgba(8,11,16,.78);border:1px solid #2e3745;border-radius:5px;color:#aeb8c7;font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;padding:3px 6px;pointer-events:none}
@media(max-width:720px){#djProjectsDrawer{width:96vw}.dj-native-row{grid-template-columns:94px minmax(0,1fr)}.dj-native-wave canvas{height:124px}.dj-native-row{min-height:124px}.dj-native-side{padding:7px 5px}}
</style>
<script id="djgabo-mvsep-workspace-patch">
(()=>{
  if(window.__djgaboMvsepStableV4)return;window.__djgaboMvsepStableV4=true;
  const S={active:false,hash:'',name:'',files:[],tracks:[],duration:0,current:0,playing:false,raf:0,zoom:0,anchor:0,viewStart:0,viewEnd:0};
  const AC=new (window.AudioContext||window.webkitAudioContext)();
  const api=p=>new URL(p||'',location.href).toString();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const fmt=s=>{s=Number.isFinite(s)?Math.max(0,s):0;const m=Math.floor(s/60),x=Math.floor(s%60),c=Math.floor((s%1)*100);return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}.${String(c).padStart(2,'0')}`};
  const roleName=r=>({voice:'Voz principal',back:'Coros',instrumental:'Instrumental',vocals_full:'Voces completas',back_instrumental:'Instrumental + coros',crowd:'Público / aplausos',other:'Audio sin público'}[r]||String(r||'Stem').replaceAll('_',' '));
  const roleColor=r=>({voice:'#ff6b91',back:'#d0a147',instrumental:'#39b982',vocals_full:'#6fb8ff',back_instrumental:'#f2b45f',crowd:'#f1885b',other:'#67d9df'}[r]||'#866eff');
  let menu,drawer,overlay,grid,statusEl,titleEl;

  function ensureGrid(){
    const editor=document.querySelector('#editor-de-stems');if(!editor)return false;
    grid=document.querySelector('#djNativeStemGrid');
    if(!grid){grid=document.createElement('div');grid.id='djNativeStemGrid';grid.innerHTML='<div class="dj-native-project-head"><div class="dj-native-project-title">Proyecto MVSEP</div><div class="dj-native-project-status">Sin proyecto</div></div><div class="dj-native-tracks"></div>';editor.appendChild(grid)}
    statusEl=grid.querySelector('.dj-native-project-status');titleEl=grid.querySelector('.dj-native-project-title');return true;
  }
  function setStatus(t,k=''){if(ensureGrid()){statusEl.textContent=t||'';statusEl.className=`dj-native-project-status ${k}`}}
  function setEditorTitle(){const ed=document.querySelector('#editor-de-stems');if(!ed)return;const els=[...ed.querySelectorAll('div,span,strong,h2,h3')];const el=els.find(x=>/^(EDITOR DE SILENCIOS|MEZCLADOR\s*\/\s*EDITOR|EDITOR DE STEMS)/i.test((x.textContent||'').trim()));if(el)el.textContent=S.active?`EDITOR DE STEMS · ${S.tracks.length} PISTAS`:'EDITOR DE STEMS'}

  function mountMenu(){
    if(document.querySelector('.dj-proj-menu-btn')){menu=document.querySelector('.dj-proj-menu-btn');return true}
    const h=document.querySelector('header.top');if(!h)return false;
    menu=document.createElement('button');menu.type='button';menu.className='dj-proj-menu-btn';menu.textContent='☰';menu.title='Proyectos';menu.setAttribute('aria-label','Proyectos');h.appendChild(menu);
    overlay=document.createElement('div');overlay.id='djProjectsOverlay';document.body.appendChild(overlay);
    drawer=document.createElement('aside');drawer.id='djProjectsDrawer';drawer.innerHTML='<div class="head"><div><div class="title">PROYECTOS</div><div class="sub">Trabajos ya procesados en MVSEP · abrir no gasta créditos</div></div><button type="button" class="close">×</button></div><div class="tools"><button type="button" class="refresh">↻ Actualizar proyectos</button></div><div id="djProjectsList"><div class="dj-loading">Abre Proyectos para consultar el historial.</div></div>';document.body.appendChild(drawer);
    menu.onclick=openDrawer;overlay.onclick=closeDrawer;drawer.querySelector('.close').onclick=closeDrawer;drawer.querySelector('.refresh').onclick=loadProjects;return true;
  }
  function openDrawer(){if(!drawer||!overlay){drawer=document.querySelector('#djProjectsDrawer');overlay=document.querySelector('#djProjectsOverlay')}if(!drawer||!overlay)return;overlay.classList.add('open');drawer.classList.add('open');loadProjects()}
  function closeDrawer(){overlay?.classList.remove('open');drawer?.classList.remove('open')}
  async function loadProjects(){const list=document.querySelector('#djProjectsList');if(!list)return;list.innerHTML='<div class="dj-loading">Consultando proyectos reales de MVSEP…</div>';try{const r=await fetch(api('api/mvsep/history?start=0&limit=20'),{cache:'no-store'});const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.detail||'No se pudo cargar el historial');list.innerHTML='';const a=Array.isArray(p.items)?p.items:[];if(!a.length){list.innerHTML='<div class="dj-loading">No hay proyectos recientes.</div>';return}a.forEach(it=>list.appendChild(projectCard(it)))}catch(e){list.innerHTML=`<div class="dj-error">Error: ${String(e.message||e)}</div>`}}
  function projectCard(it){const el=document.createElement('article');el.className='dj-project';const ok=it.job_exists&&it.status==='done';el.innerHTML='<div class="dj-project-name"></div><div class="dj-project-meta"><span class="dj-pill stat"></span><span class="dj-pill count"></span></div><div class="dj-project-meta"><span class="alg"></span><span class="date"></span></div><div class="dj-project-actions"><button type="button" class="dj-open">Abrir proyecto</button></div>';el.querySelector('.dj-project-name').textContent=it.name||it.hash||'Proyecto MVSEP';const st=el.querySelector('.stat');st.textContent=ok?'LISTO':String(it.status||'').toUpperCase();if(ok)st.classList.add('ok');el.querySelector('.count').textContent=Number.isFinite(it.file_count)?`${it.file_count} stems`:'stems —';el.querySelector('.alg').textContent=it.algorithm_name||'MVSEP';el.querySelector('.date').textContent=it.date||'';const b=el.querySelector('.dj-open');b.disabled=!ok;b.onclick=()=>openProject(it.hash);return el}

  async function openProject(hash){if(!hash||!ensureGrid())return;closeDrawer();pause();setStatus('Abriendo proyecto…');try{const r=await fetch(api(`api/mvsep/open/${encodeURIComponent(hash)}`),{cache:'no-store'});const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.detail||p.message||'No se pudo abrir');renderProject(p)}catch(e){setStatus(`Error: ${e.message||e}`,'err');alert(`No se pudo abrir el proyecto: ${e.message||e}`)}}
  function renderProject(p){S.active=true;S.hash=p.hash||'';S.name=p.name||S.hash||'Proyecto MVSEP';S.files=Array.isArray(p.files)?p.files:[];S.tracks=[];S.duration=0;S.current=0;S.playing=false;S.zoom=0;S.anchor=0;S.viewStart=0;S.viewEnd=0;document.body.classList.add('dj-project-active');ensureGrid();titleEl.textContent=S.name;const host=grid.querySelector('.dj-native-tracks');host.innerHTML='';if(!S.files.length){setStatus('0 stems','err');return}S.files.forEach((file,i)=>{const tr=makeTrack(file,i);S.tracks.push(tr);host.appendChild(tr.row)});setEditorTitle();setStatus(`${S.tracks.length} stems · cargando ondas…`);bindTransport();drawAll();loadQueue();document.querySelector('#editor-de-stems')?.scrollIntoView({behavior:'smooth',block:'start'})}
  function makeTrack(file,i){const row=document.createElement('div');row.className='dj-native-row';row.innerHTML='<div class="dj-native-side"><div class="dj-native-name"></div><div class="dj-native-role"></div><div class="dj-native-buttons"><button type="button" class="m">M</button><button type="button" class="s">S</button><button type="button" class="silence" disabled>Silenciar</button></div><div class="dj-native-vol">VOL <input type="range" min="0" max="1" step="0.01" value="1"><span>100%</span></div><div class="dj-native-info">Haz clic o arrastra</div></div><div class="dj-native-wave"><canvas></canvas><div class="dj-wave-badge">Cargando onda…</div></div>';row.querySelector('.dj-native-name').textContent=file.name||`Stem ${i+1}`;row.querySelector('.dj-native-role').textContent=roleName(file.role);const canvas=row.querySelector('canvas');const audio=new Audio(api(file.url));audio.preload='metadata';const tr={file,row,canvas,ctx:canvas.getContext('2d'),audio,buffer:null,duration:0,muted:false,solo:false,volume:1,selection:null,start:null,regions:[]};const mb=row.querySelector('.m'),sb=row.querySelector('.s'),sil=row.querySelector('.silence'),vol=row.querySelector('input'),vv=row.querySelector('.dj-native-vol span');mb.onclick=()=>{tr.muted=!tr.muted;mb.classList.toggle('on',tr.muted);applyAudibility()};sb.onclick=()=>{tr.solo=!tr.solo;sb.classList.toggle('on',tr.solo);applyAudibility()};vol.oninput=()=>{tr.volume=+vol.value;vv.textContent=`${Math.round(tr.volume*100)}%`;applyAudibility()};sil.onclick=()=>{if(tr.selection&&tr.selection.end-tr.selection.start>.04){tr.regions.push({...tr.selection});tr.selection=null;updateInfo(tr);drawAll();applyAudibility()}};audio.onloadedmetadata=()=>{if(Number.isFinite(audio.duration)){tr.duration=audio.duration;S.duration=Math.max(S.duration,tr.duration);if(!S.viewEnd)S.viewEnd=S.duration;updateView(false)}};bindCanvas(tr);return tr}

  function bindCanvas(tr){const c=tr.canvas;const tAt=e=>{const r=c.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width||1),span=Math.max(.001,(S.viewEnd||S.duration||1)-S.viewStart);return S.viewStart+x/(r.width||1)*span};c.onpointerdown=e=>{c.setPointerCapture?.(e.pointerId);const t=tAt(e);tr.start=t;tr.selection={start:t,end:t};S.anchor=t;updateInfo(tr);drawAll()};c.onpointermove=e=>{if(tr.start==null)return;const t=tAt(e);tr.selection={start:Math.min(tr.start,t),end:Math.max(tr.start,t)};S.anchor=t;updateInfo(tr);drawAll()};c.onpointerup=e=>{if(tr.start==null)return;const t=tAt(e),a=Math.min(tr.start,t),b=Math.max(tr.start,t);tr.start=null;S.anchor=t;if(b-a<.05){tr.selection=null;seek(t)}else tr.selection={start:a,end:b};updateInfo(tr);drawAll()};c.onpointercancel=()=>{tr.start=null}}
  function updateInfo(tr){const inf=tr.row.querySelector('.dj-native-info'),b=tr.row.querySelector('.silence');if(tr.selection&&tr.selection.end-tr.selection.start>=.05){inf.textContent=`${fmt(tr.selection.start)} → ${fmt(tr.selection.end)}`;b.disabled=false}else{inf.textContent=`Punto ${fmt(S.anchor)}`;b.disabled=true}}
  async function loadQueue(){let n=0;for(const tr of S.tracks){await loadWave(tr);n++;setStatus(`${n}/${S.tracks.length} ondas listas`,n===S.tracks.length?'ok':'')}if(!S.tracks.length)setStatus('0 stems','err')}
  async function loadWave(tr){const badge=tr.row.querySelector('.dj-wave-badge');try{const r=await fetch(api(tr.file.url),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const ab=await r.arrayBuffer();tr.buffer=await AC.decodeAudioData(ab.slice(0));tr.duration=tr.buffer.duration;S.duration=Math.max(S.duration,tr.duration);if(!S.viewEnd)S.viewEnd=S.duration;updateView(false);badge.textContent='Onda lista';drawAll()}catch(e){badge.textContent=`Error: ${e.message||e}`;setStatus(`Error cargando ${tr.file.name||'stem'}`,'err')}}
  function resize(c){const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(500,Math.floor((r.width||900)*d)),h=Math.max(110,Math.floor((r.height||136)*d));if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;return{w,h}}
  function drawTrack(tr){const {w,h}=resize(tr.canvas),x=tr.ctx;x.clearRect(0,0,w,h);x.fillStyle='#080c12';x.fillRect(0,0,w,h);const a=S.viewStart,b=S.viewEnd||S.duration||tr.duration||1,span=Math.max(.001,b-a),mid=h/2;if(tr.buffer){const data=tr.buffer.getChannelData(0),sr=tr.buffer.sampleRate,st=Math.max(0,Math.floor(a*sr)),en=Math.min(data.length,Math.ceil(b*sr)),step=Math.max(1,Math.floor(Math.max(1,en-st)/w));x.strokeStyle=roleColor(tr.file.role);x.lineWidth=1;x.beginPath();for(let px=0;px<w;px++){const s=st+px*step,e=Math.min(en,s+step);let mn=1,mx=-1;for(let j=s;j<e;j++){const v=data[j];if(v<mn)mn=v;if(v>mx)mx=v}x.moveTo(px,mid+mn*mid*.88);x.lineTo(px,mid+mx*mid*.88)}x.stroke()}else{x.strokeStyle='#303846';x.beginPath();x.moveTo(0,mid);x.lineTo(w,mid);x.stroke()}for(const r of tr.regions){const p1=(r.start-a)/span*w,p2=(r.end-a)/span*w;x.fillStyle='rgba(255,75,100,.24)';x.fillRect(p1,0,p2-p1,h)}if(tr.selection){const p1=(tr.selection.start-a)/span*w,p2=(tr.selection.end-a)/span*w;x.fillStyle='rgba(80,202,255,.20)';x.fillRect(p1,0,p2-p1,h)}if(S.current>=a&&S.current<=b){const p=(S.current-a)/span*w;x.strokeStyle='#fff';x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke()}const badge=tr.row.querySelector('.dj-wave-badge');if(badge&&tr.buffer)badge.textContent=`${fmt(a)}–${fmt(b)} · x${2**S.zoom}`}
  function drawAll(){if(S.active)S.tracks.forEach(drawTrack)}
  function updateView(redraw=true){if(!S.duration)return;const span=Math.max(.25,S.duration/(2**S.zoom));if(S.zoom===0){S.viewStart=0;S.viewEnd=S.duration}else{const anchor=Number.isFinite(S.anchor)?clamp(S.anchor,0,S.duration):S.current;let st=clamp(anchor-span/2,0,Math.max(0,S.duration-span));S.viewStart=st;S.viewEnd=Math.min(S.duration,st+span)}if(redraw)drawAll()}
  function silenced(tr,t){return tr.regions.some(r=>t>=r.start&&t<r.end)}
  function applyAudibility(){const solo=S.tracks.some(t=>t.solo);for(const tr of S.tracks){tr.audio.muted=tr.muted||(solo&&!tr.solo)||silenced(tr,S.current);tr.audio.volume=tr.volume}}
  async function play(){if(!S.tracks.length)return;try{if(AC.state==='suspended')await AC.resume()}catch(_){}for(const tr of S.tracks){try{tr.audio.currentTime=Math.min(S.current,tr.duration||S.current)}catch(_){}}applyAudibility();await Promise.allSettled(S.tracks.map(t=>t.audio.play()));S.playing=true;tick()}
  function pause(){S.tracks.forEach(t=>t.audio.pause());S.playing=false;cancelAnimationFrame(S.raf)}
  function seek(t){S.current=clamp(t,0,S.duration||0);S.anchor=S.current;S.tracks.forEach(tr=>{try{tr.audio.currentTime=Math.min(S.current,tr.duration||S.current)}catch(_){}});applyAudibility();drawAll()}
  function tick(){if(!S.playing)return;const m=S.tracks.find(t=>!t.audio.paused);if(m)S.current=m.audio.currentTime;applyAudibility();drawAll();S.raf=requestAnimationFrame(tick)}
  function bindTransport(){const playBtn=document.querySelector('#playBtn');if(playBtn&&!playBtn.dataset.djV4){playBtn.dataset.djV4='1';playBtn.addEventListener('click',e=>{if(!S.active)return;e.preventDefault();e.stopImmediatePropagation();S.playing?pause():play()},{capture:true})}const zoom=document.querySelector('#zoom');if(zoom&&!zoom.dataset.djV4){zoom.dataset.djV4='1';zoom.addEventListener('input',e=>{if(!S.active)return;e.stopImmediatePropagation();S.zoom=clamp(Number(zoom.value)||0,0,6);if(!S.anchor)S.anchor=S.current||S.duration/2;updateView(true)},{capture:true})}}

  function init(){ensureGrid();setEditorTitle();bindTransport();let n=0;const boot=()=>{if(mountMenu())return;if(++n<20)setTimeout(boot,250)};boot();window.addEventListener('resize',drawAll,{passive:true})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
