<style id="djgabo-mvsep-workspace-style">
#djgaboWorkspace,#djgaboDynamicMixer{display:none!important}
header.top{position:relative}
.dj-proj-menu-btn{margin-left:10px!important;min-width:40px!important;height:36px!important;border:1px solid #394457!important;background:#171d27!important;color:#eef2f7!important;border-radius:9px!important;font-size:19px!important;line-height:1!important;cursor:pointer!important;pointer-events:auto!important}
.dj-proj-menu-btn:hover{background:#222a37!important}
#djProjectsOverlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:999970;display:none}
#djProjectsOverlay.open{display:block}
#djProjectsDrawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,94vw);z-index:999980;background:#0d1118;border-left:1px solid #2d3542;box-shadow:-18px 0 50px rgba(0,0,0,.42);transform:translateX(105%);transition:transform .18s ease;color:#eef2f7;font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;pointer-events:auto}
#djProjectsDrawer.open{transform:translateX(0)}
#djProjectsDrawer *{box-sizing:border-box}
#djProjectsDrawer .head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #272f3c;background:#10151d}
#djProjectsDrawer .title{font-size:15px;font-weight:900} #djProjectsDrawer .sub{font-size:11px;color:#929fb1;margin-top:2px}
#djProjectsDrawer button{border:1px solid #394457;background:#171d27;color:#edf2f8;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}
#djProjectsDrawer .close{font-size:18px;width:36px;height:34px;padding:0}
#djProjectsDrawer .tools{padding:10px 12px;border-bottom:1px solid #252c37} #djProjectsDrawer .tools button{width:100%}
#djProjectsList{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dj-project{border:1px solid #293240;background:#111720;border-radius:10px;padding:11px;display:grid;gap:7px}.dj-project-name{font-weight:850;line-height:1.25;word-break:break-word}.dj-project-meta{display:flex;flex-wrap:wrap;gap:6px;color:#94a1b3;font-size:11px}.dj-pill{border:1px solid #354153;border-radius:999px;padding:2px 7px}.dj-pill.ok{color:#54dca8;border-color:#245f4b}.dj-project-actions{display:flex;justify-content:flex-end}.dj-open{background:#6555e8!important;border-color:#7668f3!important;color:#fff!important}.dj-loading,.dj-error{padding:14px;color:#9ba8ba}.dj-error{color:#ff8998}
body.dj-native-project-open #editor-de-stems{display:block!important}
body.dj-native-project-open #editor-de-stems .rails,body.dj-native-project-open #editor-de-stems .stems-container{display:flex!important;flex-direction:column!important}
body.dj-native-project-open #editor-de-stems .rail.dj-stem-rail{display:flex!important;min-height:142px!important;height:142px!important;box-sizing:border-box!important;flex-direction:column!important;justify-content:center!important;gap:7px!important;padding:10px!important}
body.dj-native-project-open #editor-de-stems .stem-row.dj-stem-wave-row{display:block!important;min-height:142px!important;height:142px!important;box-sizing:border-box!important}
.dj-stem-wave-row .stem-row-content,.dj-stem-wave-row .stem-row-canvas{height:100%!important;min-height:142px!important;position:relative!important}.dj-stem-wave-row canvas{display:block!important;width:100%!important;height:142px!important;touch-action:none!important;cursor:crosshair!important}
.dj-stem-title{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dj-stem-role{font-size:10px;color:#9aa7b9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dj-stem-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.dj-stem-controls button{border:1px solid #394457;background:#171d27;color:#edf2f8;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer}.dj-stem-controls button.on{background:#6555e8;border-color:#7668f3}.dj-stem-controls button.silence{background:#4f427e;border-color:#6c5bc1}.dj-vol{display:flex;align-items:center;gap:5px;font-size:10px;color:#9aa7b9}.dj-vol input{width:90px;accent-color:#7b67ff}.dj-selection-info{font-size:10px;color:#a3afc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dj-wave-view{position:absolute;right:8px;top:7px;z-index:5;background:rgba(8,11,16,.78);border:1px solid #2e3745;border-radius:5px;color:#aeb8c7;font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;padding:3px 6px;pointer-events:none}.dj-project-status{font:11px/1.25 system-ui,-apple-system,Segoe UI,sans-serif;color:#9ba8ba;margin-left:8px}.dj-project-status.ok{color:#55dda8}.dj-project-status.err{color:#ff8293}
@media(max-width:720px){#djProjectsDrawer{width:96vw}.dj-stem-rail{height:156px!important;min-height:156px!important}.dj-stem-wave-row{height:156px!important;min-height:156px!important}}
</style>
<script id="djgabo-mvsep-workspace-patch">
(()=>{
  if(window.__djgaboMvsepSafeV3)return;window.__djgaboMvsepSafeV3=true;
  const S={active:false,hash:'',name:'',files:[],tracks:[],duration:0,current:0,playing:false,raf:0,zoom:0,anchor:0,viewStart:0,viewEnd:0};
  const AC=new (window.AudioContext||window.webkitAudioContext)();
  const api=p=>new URL(p||'',location.href).toString();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const fmt=s=>{s=Number.isFinite(s)?Math.max(0,s):0;const m=Math.floor(s/60),x=Math.floor(s%60),c=Math.floor((s%1)*100);return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}.${String(c).padStart(2,'0')}`};
  const roleName=r=>({voice:'Voz principal',back:'Coros',instrumental:'Instrumental',vocals_full:'Voces completas',back_instrumental:'Instrumental + coros',crowd:'Público / aplausos',other:'Audio sin público'}[r]||String(r||'Stem').replaceAll('_',' '));
  const roleColor=r=>({voice:'#ff6b91',back:'#b985ff',instrumental:'#55d7a5',vocals_full:'#6fb8ff',back_instrumental:'#f2b45f',crowd:'#f1885b',other:'#67d9df'}[r]||'#866eff');
  let menu,drawer,overlay,rails,stems,railTemplate,stemTemplate,statusEl;

  function setTitle(){const ed=document.querySelector('#editor-de-stems');if(!ed)return;const els=[...ed.querySelectorAll('div,span,strong,h2,h3')];const el=els.find(x=>/^(EDITOR DE SILENCIOS|MEZCLADOR\s*\/\s*EDITOR|EDITOR DE STEMS)/i.test((x.textContent||'').trim()));if(!el)return;const t=S.active?`EDITOR DE STEMS · ${S.tracks.length} PISTAS`:'EDITOR DE STEMS';if(el.textContent!==t)el.textContent=t;}
  function setStatus(t,k=''){if(!statusEl){const tc=document.querySelector('.transport-card');if(tc){statusEl=document.createElement('span');statusEl.className='dj-project-status';tc.appendChild(statusEl)}}if(statusEl){statusEl.textContent=t||'';statusEl.className=`dj-project-status ${k}`}}
  function templates(){const ed=document.querySelector('#editor-de-stems');rails=ed?.querySelector('.rails');stems=ed?.querySelector('.stems-container');if(!rails||!stems)return false;if(!railTemplate){const r=rails.querySelector('.rail');if(r)railTemplate=r.cloneNode(true)}if(!stemTemplate){const w=stems.querySelector('.stem-row');if(w)stemTemplate=w.cloneNode(true)}return !!(railTemplate&&stemTemplate)}

  function mountMenu(){if(document.querySelector('.dj-proj-menu-btn'))return true;const h=document.querySelector('header.top');if(!h)return false;menu=document.createElement('button');menu.type='button';menu.className='dj-proj-menu-btn';menu.textContent='☰';menu.title='Proyectos';menu.setAttribute('aria-label','Proyectos');h.appendChild(menu);overlay=document.createElement('div');overlay.id='djProjectsOverlay';document.body.appendChild(overlay);drawer=document.createElement('aside');drawer.id='djProjectsDrawer';drawer.innerHTML='<div class="head"><div><div class="title">PROYECTOS</div><div class="sub">Trabajos ya procesados en MVSEP · abrir no gasta créditos</div></div><button type="button" class="close">×</button></div><div class="tools"><button type="button" class="refresh">↻ Actualizar proyectos</button></div><div id="djProjectsList"><div class="dj-loading">Abre Proyectos para consultar el historial.</div></div>';document.body.appendChild(drawer);menu.onclick=()=>openDrawer();overlay.onclick=closeDrawer;drawer.querySelector('.close').onclick=closeDrawer;drawer.querySelector('.refresh').onclick=loadProjects;return true}
  function openDrawer(){if(!drawer||!overlay)mountMenu();overlay?.classList.add('open');drawer?.classList.add('open');loadProjects()}
  function closeDrawer(){overlay?.classList.remove('open');drawer?.classList.remove('open')}
  async function loadProjects(){const list=document.querySelector('#djProjectsList');if(!list)return;list.innerHTML='<div class="dj-loading">Consultando proyectos reales de MVSEP…</div>';try{const r=await fetch(api('api/mvsep/history?start=0&limit=20'),{cache:'no-store'});const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.detail||'No se pudo cargar el historial');list.innerHTML='';const a=Array.isArray(p.items)?p.items:[];if(!a.length){list.innerHTML='<div class="dj-loading">No hay proyectos recientes.</div>';return}for(const it of a)list.appendChild(projectCard(it))}catch(e){list.innerHTML=`<div class="dj-error">Error: ${String(e.message||e)}</div>`}}
  function projectCard(it){const el=document.createElement('article');el.className='dj-project';const ok=it.job_exists&&it.status==='done';el.innerHTML='<div class="dj-project-name"></div><div class="dj-project-meta"><span class="dj-pill stat"></span><span class="dj-pill count"></span></div><div class="dj-project-meta"><span class="alg"></span><span class="date"></span></div><div class="dj-project-actions"><button type="button" class="dj-open">Abrir proyecto</button></div>';el.querySelector('.dj-project-name').textContent=it.name||it.hash||'Proyecto MVSEP';const st=el.querySelector('.stat');st.textContent=ok?'LISTO':String(it.status||'').toUpperCase();if(ok)st.classList.add('ok');el.querySelector('.count').textContent=Number.isFinite(it.file_count)?`${it.file_count} stems`:'stems —';el.querySelector('.alg').textContent=it.algorithm_name||'MVSEP';el.querySelector('.date').textContent=it.date||'';const b=el.querySelector('.dj-open');b.disabled=!ok;b.onclick=()=>openProject(it.hash);return el}

  async function openProject(hash){if(!hash)return;if(!templates()){alert('No encontré el editor de stems.');return}closeDrawer();stop();setStatus('Abriendo proyecto…');try{const r=await fetch(api(`api/mvsep/open/${encodeURIComponent(hash)}`),{cache:'no-store'});const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.detail||p.message||'No se pudo abrir');renderProject(p)}catch(e){setStatus(`Error: ${e.message||e}`,'err');alert(`No se pudo abrir el proyecto: ${e.message||e}`)}}
  function renderProject(p){S.active=true;S.hash=p.hash||'';S.name=p.name||S.hash;S.files=Array.isArray(p.files)?p.files:[];S.tracks=[];S.duration=0;S.current=0;S.playing=false;S.zoom=0;S.anchor=0;S.viewStart=0;S.viewEnd=0;document.body.classList.add('dj-native-project-open');rails.innerHTML='';stems.innerHTML='';for(let i=0;i<S.files.length;i++){const tr=makeTrack(S.files[i],i);S.tracks.push(tr);rails.appendChild(tr.rail);stems.appendChild(tr.waveRow)}setTitle();setStatus(`${S.tracks.length} stems · cargando ondas…`);drawAll();loadQueue();document.querySelector('#editor-de-stems')?.scrollIntoView({behavior:'smooth',block:'start'})}
  function makeTrack(file,i){const rail=railTemplate.cloneNode(true);rail.className='rail dj-stem-rail';rail.innerHTML=`<div class="dj-stem-title"></div><div class="dj-stem-role"></div><div class="dj-stem-controls"><button type="button" class="m">M</button><button type="button" class="s">S</button><button type="button" class="silence" disabled>Silenciar selección</button></div><div class="dj-vol">VOL <input type="range" min="0" max="1" step="0.01" value="1"><span>100%</span></div><div class="dj-selection-info">Haz clic o arrastra sobre la onda</div>`;rail.querySelector('.dj-stem-title').textContent=file.name||`Stem ${i+1}`;rail.querySelector('.dj-stem-role').textContent=roleName(file.role);
    const waveRow=stemTemplate.cloneNode(true);waveRow.className='stem-row dj-stem-wave-row';waveRow.innerHTML=`<div class="stem-row-content"><div class="stem-row-canvas"><canvas id="djStemWave_${i}"></canvas><div class="dj-wave-view">Cargando onda…</div></div></div>`;const canvas=waveRow.querySelector('canvas');const audio=document.createElement('audio');audio.className='dj-stem-audio';audio.src=api(file.url);audio.preload='metadata';audio.style.display='none';waveRow.appendChild(audio);const tr={file,rail,waveRow,canvas,ctx:canvas.getContext('2d'),audio,buffer:null,duration:0,muted:false,solo:false,volume:1,selection:null,start:null,regions:[]};
    const mb=rail.querySelector('.m'),sb=rail.querySelector('.s'),vb=rail.querySelector('input[type=range]'),vv=rail.querySelector('.dj-vol span'),sil=rail.querySelector('.silence');mb.onclick=()=>{tr.muted=!tr.muted;mb.classList.toggle('on',tr.muted);applyAudibility()};sb.onclick=()=>{tr.solo=!tr.solo;sb.classList.toggle('on',tr.solo);applyAudibility()};vb.oninput=()=>{tr.volume=+vb.value;vv.textContent=`${Math.round(tr.volume*100)}%`;applyAudibility()};sil.onclick=()=>{if(tr.selection&&tr.selection.end-tr.selection.start>.04){tr.regions.push({...tr.selection});tr.selection=null;updateInfo(tr);drawTrack(tr);applyAudibility()}};bindCanvas(tr);audio.onloadedmetadata=()=>{if(Number.isFinite(audio.duration)){tr.duration=audio.duration;S.duration=Math.max(S.duration,tr.duration);if(!S.viewEnd)S.viewEnd=S.duration;updateView(false)}};return tr}

  function bindCanvas(tr){const c=tr.canvas;const tAt=e=>{const r=c.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width||1),span=Math.max(.001,(S.viewEnd||S.duration||1)-S.viewStart);return S.viewStart+x/(r.width||1)*span};c.onpointerdown=e=>{c.setPointerCapture?.(e.pointerId);const t=tAt(e);tr.start=t;tr.selection={start:t,end:t};S.anchor=t;updateInfo(tr);drawTrack(tr)};c.onpointermove=e=>{if(tr.start==null)return;const t=tAt(e);tr.selection={start:Math.min(tr.start,t),end:Math.max(tr.start,t)};S.anchor=t;updateInfo(tr);drawTrack(tr)};c.onpointerup=e=>{if(tr.start==null)return;const t=tAt(e),a=Math.min(tr.start,t),b=Math.max(tr.start,t);tr.start=null;S.anchor=t;if(b-a<.05){tr.selection=null;seek(t)}else tr.selection={start:a,end:b};updateInfo(tr);drawAll()};c.onpointercancel=()=>{tr.start=null}}
  function updateInfo(tr){const inf=tr.rail.querySelector('.dj-selection-info'),b=tr.rail.querySelector('.silence');if(tr.selection&&tr.selection.end-tr.selection.start>=.05){inf.textContent=`Selección ${fmt(tr.selection.start)} → ${fmt(tr.selection.end)}`;b.disabled=false}else{inf.textContent=`Punto ${fmt(S.anchor)} · arrastra para seleccionar`;b.disabled=true}}
  async function loadQueue(){let n=0;for(const tr of S.tracks){await loadWave(tr);n++;setStatus(`${n}/${S.tracks.length} ondas listas`,n===S.tracks.length?'ok':'')}if(!S.tracks.length)setStatus('0 stems','err')}
  async function loadWave(tr){const badge=tr.waveRow.querySelector('.dj-wave-view');try{const r=await fetch(api(tr.file.url),{cache:'force-cache'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const ab=await r.arrayBuffer();tr.buffer=await AC.decodeAudioData(ab.slice(0));tr.duration=tr.buffer.duration;S.duration=Math.max(S.duration,tr.duration);if(!S.viewEnd)S.viewEnd=S.duration;updateView(false);badge.textContent='Onda lista';drawAll()}catch(e){badge.textContent=`Error onda: ${e.message||e}`}}
  function resize(c){const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(600,Math.floor((r.width||900)*d)),h=Math.max(120,Math.floor((r.height||142)*d));if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;return{w,h}}
  function drawTrack(tr){const {w,h}=resize(tr.canvas),x=tr.ctx;x.clearRect(0,0,w,h);x.fillStyle='#0a0e14';x.fillRect(0,0,w,h);const a=S.viewStart,b=S.viewEnd||S.duration||tr.duration||1,span=Math.max(.001,b-a),mid=h/2;if(tr.buffer){const data=tr.buffer.getChannelData(0),sr=tr.buffer.sampleRate,st=Math.max(0,Math.floor(a*sr)),en=Math.min(data.length,Math.ceil(b*sr)),step=Math.max(1,Math.floor(Math.max(1,en-st)/w));x.strokeStyle=roleColor(tr.file.role);x.beginPath();for(let px=0;px<w;px++){const s=st+px*step,e=Math.min(en,s+step);let mn=1,mx=-1;for(let j=s;j<e;j++){const v=data[j];if(v<mn)mn=v;if(v>mx)mx=v}x.moveTo(px,mid+mn*mid*.88);x.lineTo(px,mid+mx*mid*.88)}x.stroke()}else{x.strokeStyle='#303846';x.beginPath();x.moveTo(0,mid);x.lineTo(w,mid);x.stroke()}for(const r of tr.regions){const p1=(r.start-a)/span*w,p2=(r.end-a)/span*w;x.fillStyle='rgba(255,75,100,.24)';x.fillRect(p1,0,p2-p1,h)}if(tr.selection){const p1=(tr.selection.start-a)/span*w,p2=(tr.selection.end-a)/span*w;x.fillStyle='rgba(80,202,255,.2)';x.fillRect(p1,0,p2-p1,h)}if(S.current>=a&&S.current<=b){const p=(S.current-a)/span*w;x.strokeStyle='#fff';x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke()}const badge=tr.waveRow.querySelector('.dj-wave-view');if(badge&&tr.buffer)badge.textContent=`${fmt(a)}–${fmt(b)} · x${2**S.zoom}`}
  function drawAll(){if(!S.active)return;for(const t of S.tracks)drawTrack(t)}
  function updateView(redraw=true){if(!S.duration)return;const span=Math.max(.25,S.duration/(2**S.zoom));if(S.zoom===0){S.viewStart=0;S.viewEnd=S.duration}else{let st=clamp(S.anchor-span/2,0,Math.max(0,S.duration-span));S.viewStart=st;S.viewEnd=Math.min(S.duration,st+span)}if(redraw)drawAll()}
  function seek(t){S.current=clamp(t,0,S.duration||0);S.anchor=S.current;for(const tr of S.tracks){try{tr.audio.currentTime=Math.min(S.current,tr.duration||S.current)}catch(_){}}applyAudibility();drawAll()}
  function inMute(tr,t){return tr.regions.some(r=>t>=r.start&&t<r.end)}
  function applyAudibility(){const solo=S.tracks.some(t=>t.solo);for(const tr of S.tracks){const audible=!tr.muted&&(!solo||tr.solo)&&!inMute(tr,S.current);tr.audio.muted=!audible;tr.audio.volume=clamp(tr.volume,0,1)}}
  async function play(){if(!S.active||!S.tracks.length)return;try{if(AC.state==='suspended')await AC.resume()}catch(_){}for(const tr of S.tracks){try{tr.audio.currentTime=Math.min(S.current,tr.duration||S.current)}catch(_){}}applyAudibility();await Promise.allSettled(S.tracks.map(t=>t.audio.play()));S.playing=true;tick()}
  function pause(){for(const t of S.tracks)t.audio.pause();S.playing=false;cancelAnimationFrame(S.raf)}
  function stop(){pause();S.current=0;for(const t of S.tracks){try{t.audio.currentTime=0}catch(_){}}drawAll()}
  function tick(){if(!S.playing)return;const m=S.tracks.find(t=>!t.audio.paused);if(m)S.current=m.audio.currentTime;applyAudibility();drawAll();S.raf=requestAnimationFrame(tick)}

  function bindProjectControls(){const playBtn=document.querySelector('#playBtn');if(playBtn&&!playBtn.dataset.djSafe){playBtn.dataset.djSafe='1';playBtn.addEventListener('click',e=>{if(!S.active)return;e.preventDefault();e.stopImmediatePropagation();S.playing?pause():play()},{capture:true})}const zoom=document.querySelector('#zoom');if(zoom&&!zoom.dataset.djSafe){zoom.dataset.djSafe='1';zoom.addEventListener('input',e=>{if(!S.active)return;e.stopImmediatePropagation();S.zoom=clamp(Number(zoom.value)||0,0,6);if(!S.anchor)S.anchor=S.current||S.duration/2;updateView(true)},{capture:true})}}
  function init(){setTitle();templates();bindProjectControls();let tries=0;const boot=()=>{if(mountMenu())return;if(++tries<20)setTimeout(boot,250)};boot();window.addEventListener('resize',drawAll,{passive:true})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
